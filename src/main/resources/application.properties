spring.datasource.url=jdbc:postgresql://localhost:5432/db_dispo_horario_uts
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# create, create-drop, validate, update
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=debug


# Logging levels: enable DEBUG for validation package only
logging.level.com.example.demo.validation=DEBUG
logging.level.com.example.demo.validation.decorator=DEBUG

# Optional: keep app logs at INFO by default
logging.level.com.example.demo=INFO

spring.profiles.active=${PROFILE:dev}


user.default.gmail=${USER_DEFAULT:correo}
pass.default.gmail=${PASS_DEFAULT:contra}
